<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>une·deux — gabarit intro + titre animé (Ce jour-là)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="tokens/fonts.css" />
    <link rel="stylesheet" href="tokens/colors.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      body { font-family: 'Archivo', system-ui, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }

      /* composite pré-cuit (fond flouté/désaturé + plan net, ffmpeg en amont
         — recette §2 CLAUDE.md, inchangée) : simple <video> plein cadre */
      .video-full { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

      /* header — constantes fixes de la série (§3 CLAUDE.md), reprises à
         l'identique de editeur-series.html, jamais improvisées */
      #hdr { position: absolute; inset: 0 0 auto 0; z-index: 20; }
      .ring {
        position: absolute; left: 96px; top: 216px; width: 92px; height: 92px; border-radius: 50%;
        border: 4px solid var(--cream); display: flex; align-items: center; justify-content: center;
        font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 38px; color: var(--cream);
      }
      .wordmark { position: absolute; left: 214px; top: 262px; transform: translateY(-50%); font-family: 'Anton', sans-serif; font-size: 58px; color: var(--cream); }
      .handle { position: absolute; right: 96px; top: 262px; transform: translateY(-50%); font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 32px; color: var(--cream); }
      .hairline { position: absolute; left: 96px; right: 96px; top: 318px; height: 4px; background: var(--cream); }
      .tag {
        position: absolute; left: 96px; top: 350px; height: 58px; z-index: 20;
        display: flex; align-items: center; background: var(--ocre); color: var(--ink);
        font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 32px; padding: 0 15px;
      }

      /* titre animé — porté à l'identique du template "titre seul" cejourla
         de editeur-series.html (canvas draw(), branche state.serie==='cejourla')
         taille 150px CSS (calibrée par comparaison de frame avec la vidéo de
         référence — un canvas 130px et un texte CSS 130px n'ont PAS le même
         corps apparent : la hauteur de casse mesurée en pixels sur la vidéo
         de référence exigeait ~150px CSS pour être reproduite à l'identique,
         cf. CLAUDE.md), Anton, aligné à gauche (pas centré — spécifique au
         titre, contrairement au corps de texte du §4), ancré bas de cadre.
         Pas d'ombre portée (contrairement au corps de texte du §4) : la
         vidéo de référence n'en a aucune, la lisibilité vient du carré plein
         sur les mots-clés et du fond assombri sous le composite. */
      .title-zone { position: absolute; inset: 0; z-index: 10; }
      .t-line {
        position: absolute; left: 96px; right: 96px;
        font-family: 'Anton', sans-serif; font-size: 140px; line-height: 1;
        text-transform: uppercase; color: var(--cream); opacity: 0;
      }
      /* mot(s)-clé encadré(s) : carré fusionné derrière un groupe de mots
         consécutifs accentués (drawWordLine — kwPad=10, carré teinte de
         série "ocre" pour cejourla, texte toujours crème) — le padding est
         compensé par une marge négative égale pour ne pas décaler le texte
         par rapport aux lignes non encadrées */
      .kw-box { background: var(--ocre); padding: 10px; margin: -10px; display: inline-block; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="4.6000"
      data-fps="30"
    >
      <video class="video-full" id="full" src="assets/full.mp4" data-start="0.0000" data-duration="4.6000" data-track-index="1" muted playsinline></video>

      <div id="hdr">
        <div class="ring">1·2</div>
        <div class="wordmark">une·deux</div>
        <div class="handle">@UNE.DEUX</div>
        <div class="hairline"></div>
      </div>
      <div class="tag">CE JOUR LÀ …</div>

      <!-- titre du post (source : champ TITRE du brouillon "POST DU JOUR"),
           découpé en lignes à la main (l'auto-wrap du canvas de l'éditeur
           n'existe pas côté HyperFrames — le calage a été vérifié par
           extraction de frame, cf. §check CLAUDE.md) ; mots-clés du bas
           encadrés (dernières lignes, faits marquants) -->
      <div class="title-zone">
        <div class="t-line" id="l1" style="top:1194px">3 AOÛT 2017 : LE</div>
        <div class="t-line" id="l2" style="top:1322px">PLUS GROS</div>
        <div class="t-line" id="l3" style="top:1451px"><span class="kw-box">TRANSFERT DE</span></div>
        <div class="t-line" id="l4" style="top:1580px"><span class="kw-box">L&rsquo;HISTOIRE</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* apparition ligne par ligne — formule exacte de l'éditeur (draw(),
         state.serie==='cejourla') : revealMs=620/vitesse, fadeMs=clamp(80,
         220, revealMs*0.6), rampe linéaire (pas d'easing dans le canvas) +
         léger décalage vertical 8px→0 qui accompagne le fondu */
      const start = 0.3, revealMs = 0.62, fadeMs = 0.22;
      const lines = ['#l1', '#l2', '#l3', '#l4'];
      lines.forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: fadeMs, ease: 'none' }, start + i * revealMs);
      });

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
